name: Bản tin hằng ngày

on:
  schedule:
    # 13:00 UTC = 20:00 giờ VN. Crawl + AI mất khoảng 20 phút, GitHub cũng hay trễ lịch
    # 5-20 phút, nên bản tin thường lên web khoảng 20:20-20:40.
    - cron: "0 13 * * *"
  workflow_dispatch:          # nút "Run workflow" để chạy tay
    inputs:
      skip_crawl:
        description: "Bỏ qua crawl, dùng lại dữ liệu đã lưu hôm nay (chỉ chạy lại AI + web)"
        type: boolean
        default: false
      build_only:
        description: "Chỉ dựng lại trang web (sau khi sửa giao diện)"
        type: boolean
        default: false
  push:                       # sửa giao diện thì dựng lại web, không crawl
    branches: [main]
    paths: ["templates/**", "static/**", "build_site.py"]

permissions:
  contents: write             # commit digests/ và data/ vào repo
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
        with:
          # lấy bản mới nhất của nhánh lúc bắt đầu chạy, không phải lúc bấm/push: lần dựng web
          # phải xếp hàng chờ bản tin chạy xong vẫn thấy bản tin vừa commit
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl + AI tóm tắt
        if: github.event_name != 'push' && !inputs.build_only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_daily.py ${{ inputs.skip_crawl && '--from-data' || '' }}

      - name: Lưu bản tin và dữ liệu thô vào repo
        if: github.event_name != 'push' && !inputs.build_only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests data
          git commit -m "Bản tin $(date +%F)" || echo "Không có gì mới để commit"
          git pull --rebase
          git push

      - name: Dựng trang web
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
